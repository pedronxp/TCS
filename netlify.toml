# Configuração de deploy do dashboard no Netlify
# Repo: pasta raiz do projeto TCS — o dashboard fica em dashboard/

[build]
  base    = "dashboard"
  command = "npm ci && npm run build"
  publish = "dist"
  ignore  = "git -C \"$(git rev-parse --show-toplevel)\" diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- dashboard"

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota não encontrada retorna index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache longo para assets com hash (gerados pelo Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
