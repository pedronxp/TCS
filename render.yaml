services:
  - type: web
    name: tcs-whatsapp-bot-cataguases
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./bot-whatsapp/Dockerfile
    dockerContext: ./bot-whatsapp
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_CONNECT_TIMEOUT_MS
        value: 60000
      - key: DASHBOARD_ORIGIN
        value: https://tcsvistoria.pages.dev
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BOT_SESSION_ENCRYPTION_KEY
        generateValue: true
