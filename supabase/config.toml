project_id = "tcs-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://tcsvisto.netlify.app"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**", "https://tcsvisto.netlify.app/**", "tcs://auth/callback", "tcs://auth/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true
minimum_password_length = 8

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.remote-document-acknowledgement]
verify_jwt = false

[functions.public-preview-access]
verify_jwt = false

[functions.trigger-build]
verify_jwt = true

[functions.send-auth-email]
# Supabase Auth Hooks authenticate with Standard Webhooks signatures, not JWT.
verify_jwt = false

[functions.inspection-upload-authorize]
verify_jwt = true

[functions.portal-acknowledgement-document]
verify_jwt = true

[functions.dispatch-operational-notification]
verify_jwt = true

[functions.password-recovery-request]
# Public entrypoint with origin, input and server-side quota controls in the function.
verify_jwt = false

[analytics]
enabled = false
