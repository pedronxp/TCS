name: Android APK startup diagnostic
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: HTTPS URL of the signed APK to test
        required: true
        type: string
      previous_apk_url:
        description: Optional HTTPS URL of the previous APK to test an in-place update
        required: false
        type: string
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: curl --proto '=https' --tlsv1.2 -fL "$APK_URL" -o tcs.apk
      - uses: ./.github/actions/android-startup
        with:
          apk-file: tcs.apk
          previous-apk-url: ${{ inputs.previous_apk_url }}
