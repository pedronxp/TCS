name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: TypeScript + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --coverage --ci
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  dashboard-contracts:
    name: Portal contracts + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Run portal unit and contract tests
        run: npm test

      - name: Build portal and internal console
        run: npm run build

  database-contracts:
    name: Database migration contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The legacy schema baseline predates the migration history. Until #37
      # reconstructs it from the authoritative schema, run the isolated PGlite
      # contracts instead of pretending an empty-database replay is valid.
      - name: Validate subscription migrations
        run: npm run test:subscription-migration

      - name: Validate internal agent data boundaries
        run: npm run test:agent-detail

      - name: Validate archive and restore security
        run: npm run test:archive-restore

      - name: Validate web acknowledgement contracts
        run: npm run test:document-acknowledgement-web

      - name: Validate acknowledgement link safety
        run: npm run test:document-acknowledgement-links

      - name: Validate document release order
        run: npm run test:document-release-workflow

      - name: Validate document release integration
        run: npm run test:document-release-integration

      - name: Validate local acknowledgement migration
        run: npm run test:document-acknowledgement-sqlite

  dashboard-visual-regression:
    name: Dashboard visual regression
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect dashboard changes
        id: dashboard_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $baseCommit = "${{ github.event.pull_request.base.sha }}"
          $headCommit = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = git diff --name-only $baseCommit $headCommit
          $hasDashboardChanges = @(
            $changedFiles | Where-Object { $_ -like "dashboard/*" }
          ).Count -gt 0

          "changed=$($hasDashboardChanges.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js
        if: steps.dashboard_changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        if: steps.dashboard_changes.outputs.changed == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.dashboard_changes.outputs.changed == 'true'
        run: npx playwright install chromium

      - name: Compare dashboard route snapshots
        if: steps.dashboard_changes.outputs.changed == 'true'
        run: npm run test:visual

      - name: Upload visual regression diagnostics
        uses: actions/upload-artifact@v7
        if: failure() && steps.dashboard_changes.outputs.changed == 'true'
        with:
          name: dashboard-visual-regression
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 7
