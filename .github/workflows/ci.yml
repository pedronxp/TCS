name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: TypeScript + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --coverage --ci
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  dashboard-contracts:
    name: Portal contracts + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Run portal unit and contract tests
        run: npm test

      - name: Build portal and internal console
        run: npm run build

  database-security:
    name: Supabase migrations + RLS contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start isolated Supabase stack
        run: npx --yes supabase@2.111.0 start

      - name: Run migrations and pgTAP security contracts
        run: npx --yes supabase@2.111.0 test db --local

      - name: Stop isolated Supabase stack
        if: always()
        run: npx --yes supabase@2.111.0 stop --no-backup

  dashboard-visual-regression:
    name: Dashboard visual regression
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect dashboard changes
        id: dashboard_changes
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -ne "pull_request") {
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $baseCommit = "${{ github.event.pull_request.base.sha }}"
          $headCommit = "${{ github.event.pull_request.head.sha }}"
          $changedFiles = git diff --name-only $baseCommit $headCommit
          $hasDashboardChanges = @(
            $changedFiles | Where-Object { $_ -like "dashboard/*" }
          ).Count -gt 0

          "changed=$($hasDashboardChanges.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js
        if: steps.dashboard_changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        if: steps.dashboard_changes.outputs.changed == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.dashboard_changes.outputs.changed == 'true'
        run: npx playwright install chromium

      - name: Compare dashboard route snapshots
        if: steps.dashboard_changes.outputs.changed == 'true'
        run: npm run test:visual

      - name: Upload visual regression diagnostics
        uses: actions/upload-artifact@v4
        if: failure() && steps.dashboard_changes.outputs.changed == 'true'
        with:
          name: dashboard-visual-regression
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          retention-days: 7
