name: Android APK startup diagnostic
on:
  workflow_dispatch:
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download generated APK
        run: curl -fL 'https://expo.dev/artifacts/eas/gRl5In15FOt_dZhzV21VCcn0srolsyR-PiHGikK_U_c.apk' -o tcs.apk
      - name: Install and launch APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r tcs.apk
            adb logcat -c
            adb shell monkey -p com.tcs.relatorioderisco -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d -b crash > startup-crash.txt
            adb logcat -d | grep -E 'ReactNativeJS|AndroidRuntime|FATAL|SoLoader|TCS' > startup-log.txt || true
            cat startup-crash.txt
            cat startup-log.txt
            adb shell pidof com.tcs.relatorioderisco
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-logs
          path: startup-*.txt
