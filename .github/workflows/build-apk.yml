name: Build and verify Android release APK
on:
  workflow_dispatch:
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed release APK
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --json > eas-build-output.json
          APK_URL=$(node -p "JSON.parse(require('fs').readFileSync('eas-build-output.json','utf8'))[0].artifacts.buildUrl")
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK_URL"
          curl -fL "$APK_URL" -o tcs.apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch signed release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/ci/android-startup-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-evidence
          path: |
            startup-*
            eas-build-output.json
