name: Build APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview | production)'
        required: true
        default: 'production'
        type: choice
        options: [preview, production]
      version:
        description: 'App version (ex: 1.4.0)'
        required: true
        type: string
      changelog:
        description: 'Changelog desta versão'
        required: false
        type: string

jobs:
  build:
    name: EAS Build APK (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Diagnose failed Android build
        run: |
          eas build:view 6e54c76c-5465-4cd2-8c9c-d2fc0d73bdb0 --json > /tmp/tcs-build.json
          node -e 'const b=require("/tmp/tcs-build.json"); console.log(JSON.stringify({status:b.status,error:b.error,logs:(b.logFiles||[]).length}));'
          node -e 'const b=require("/tmp/tcs-build.json"); (async()=>{for(const url of (b.logFiles||[])){const r=await fetch(url);const lines=(await r.text()).split("\n");for(const line of lines.filter(l=>/What went wrong|Execution failed|Cannot find module|Unable to resolve|error:|CMake Error|Unsupported class file/i.test(l)).slice(-25)){try{const row=JSON.parse(line);console.log(String(row.msg||row.message||"").slice(0,500))}catch{console.log(line.slice(0,500))}}}})().catch(e=>{console.error(e.message);process.exitCode=1});'

      - name: Build APK via EAS
        if: false
        id: eas_build
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --json > eas-build-output.json

          APK_URL=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d[0].get('artifacts',{}).get('buildUrl',''))" eas-build-output.json)
          BUILD_ID=$(python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(d[0].get('id',''))" eas-build-output.json)

          if [ -z "$APK_URL" ] || [ -z "$BUILD_ID" ]; then
            echo "A EAS não retornou o artefato Android esperado." >&2
            cat eas-build-output.json >&2
            exit 1
          fi

          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "eas_build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Atualizar status no Supabase
        if: false
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          APK_URL: ${{ steps.eas_build.outputs.apk_url }}
          EAS_BUILD_ID: ${{ steps.eas_build.outputs.eas_build_id }}
          VERSION: ${{ inputs.version }}
          PROFILE: ${{ inputs.profile }}
          CHANGELOG: ${{ inputs.changelog }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATUS="success"
          if [ "$JOB_STATUS" != "success" ]; then STATUS="failed"; fi

          curl -s -X POST "$SUPABASE_URL/rest/v1/builds" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{
              \"github_run_id\": \"$GITHUB_RUN_ID\",
              \"provider\": \"github_actions\",
              \"version\": \"$VERSION\",
              \"profile\": \"$PROFILE\",
              \"changelog\": \"$CHANGELOG\",
              \"status\": \"$STATUS\",
              \"eas_build_id\": \"$EAS_BUILD_ID\",
              \"apk_url\": \"$APK_URL\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }" || true
